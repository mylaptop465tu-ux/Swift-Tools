<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Converter | Swift Tools</title>

<style>
  :root {
    --blue: #2563eb;
    --light-blue: #e8f0ff;
    --dark: #1f2937;
  }

  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #f9fbff;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 700px;
    margin: 40px auto;
    background: #fff;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
  }

  h1 {
    text-align: center;
    color: var(--blue);
    margin-bottom: 10px;
  }

  p {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
  }

  .upload-box {
    border: 2px dashed var(--blue);
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    background: var(--light-blue);
  }

  input[type="file"] {
    margin-top: 10px;
  }

  .preview {
    margin-top: 20px;
    text-align: center;
  }

  .preview img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
  }

  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  select, button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
  }

  select {
    border: 1px solid #ccc;
  }

  button {
    background: var(--blue);
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  .download {
    display: none;
    margin-top: 20px;
    text-align: center;
  }

  .download a {
    display: inline-block;
    background: #16a34a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
  }

  @media (max-width: 600px) {
    .controls {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Image Converter</h1>
  <p>Upload an image and convert it to another format instantly.</p>

  <div class="upload-box">
    <label><strong>Select Image</strong></label><br>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="preview" id="previewBox"></div>

  <div class="controls">
    <select id="formatSelect">
      <option value="image/jpeg">Convert to JPG</option>
      <option value="image/png">Convert to PNG</option>
      <option value="image/webp">Convert to WEBP</option>
    </select>

    <button onclick="convertImage()">Convert Image</button>
  </div>

  <div class="download" id="downloadBox">
    <a id="downloadLink" download>Download Converted Image</a>
  </div>
</div>

<script>
  let originalImage = new Image();

  document.getElementById("imageInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      originalImage.src = event.target.result;
      document.getElementById("previewBox").innerHTML =
        `<img src="${event.target.result}" alt="Preview">`;
    };
    reader.readAsDataURL(file);
  });

  function convertImage() {
    if (!originalImage.src) {
      alert("Please upload an image first.");
      return;
    }

    const format = document.getElementById("formatSelect").value;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = originalImage.width;
    canvas.height = originalImage.height;
    ctx.drawImage(originalImage, 0, 0);

    const convertedData = canvas.toDataURL(format, 0.9);
    const downloadLink = document.getElementById("downloadLink");

    downloadLink.href = convertedData;
    downloadLink.download = `converted-image.${format.split('/')[1]}`;
    document.getElementById("downloadBox").style.display = "block";
  }
</script>

</body>
</html>
